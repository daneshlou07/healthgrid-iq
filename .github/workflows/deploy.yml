name: Deploy HealthGrid IQ

on:
  push:
    branches:
      - healthgridiq-stg-01

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy HealthGrid IQ
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            "$GITHUB_WORKSPACE/" \
            "/opt/docker/healthgridiq/app/"

          cd /opt/docker/healthgridiq

          docker compose up -d --build

      - name: Verify deployment
        run: |
          docker ps
          curl -I http://127.0.0.1
